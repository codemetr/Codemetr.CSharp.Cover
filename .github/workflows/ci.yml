name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore --locked-mode
      - run: dotnet build -c Release --no-restore -p:ContinuousIntegrationBuild=true
      - name: Test (with the integration test on xUnit, NUnit and MSTest)
        run: dotnet test -c Release --no-build
        env:
          CODEMETR_COVER_INTEGRATION: '1'
      - run: dotnet pack -c Release --no-build -o artifacts
      - name: Guard own metrics
        run: bash scripts/check-metrics.sh
      - name: Guard own coverage
        run: bash scripts/check-coverage.sh "origin/${{ github.base_ref || 'main' }}"
        env:
          CODEMETR_COVER_INTEGRATION: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*.nupkg
